<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#14274a">
    <title>Entrar | Ponto Batista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_estatica('css/base.css') }}">
</head>
<body>
    <main class="pagina-login">
        <aside class="login-lado">
            <span class="marca">Ponto Batista</span>
            <div>
                <p class="relogio-digital" id="relogio-login">--:--:--</p>
                <p class="login-data" id="data-login"></p>
            </div>
            <p class="login-sub">Registro de ponto dos funcionários do Instituto Batista.</p>
        </aside>
        <section class="cartao-login" aria-labelledby="titulo-pagina">
            <header class="cabecalho-login">
                <h1 id="titulo-pagina">Entrar</h1>
                <p class="muted">Use o login e a senha cadastrados pela escola.</p>
            </header>

            {% if mensagem_erro %}
                <p class="mensagem-erro" role="alert">{{ mensagem_erro }}</p>
            {% endif %}

            <form class="formulario-login" action="" method="post" autocomplete="off">
                {% if ponto_qr %}<input type="hidden" name="ponto_qr" value="{{ ponto_qr }}">{% endif %}
                <div class="campo-formulario">
                    <label for="login">Login</label>
                    <input id="login" name="login" type="text" autocomplete="username" required autofocus>
                </div>
                <div class="campo-formulario">
                    <label for="senha">Senha</label>
                    <div class="entrada-senha">
                        <input id="senha" name="senha" type="password" autocomplete="new-password" required>
                        <button class="botao-visualizar-senha" id="alternar-visibilidade-senha" type="button" aria-label="Mostrar senha" aria-pressed="false"></button>
                    </div>
                </div>
                <div class="linha-recuperacao"><a href="/recuperar-senha">Esqueci minha senha</a></div>
                <button class="botao-entrar" type="submit">Entrar</button>
            </form>
        </section>
    </main>
    <script src="{{ url_estatica('js/login.js') }}" defer></script>
    <script>
        const r = document.getElementById("relogio-login"), d = document.getElementById("data-login");
        const tick = () => {
            r.textContent = new Date().toLocaleTimeString("pt-BR", { hour12: false });
            d.textContent = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
        };
        tick(); setInterval(tick, 1000);
    </script>
</body>
</html>
