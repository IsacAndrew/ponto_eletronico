<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua senha | Ponto Eletrônico</title>
    <link rel="stylesheet" href="/static/css/trocar_senha.css">
    <script src="/static/js/trocar_senha.js" defer></script>
</head>
<body>
    <main class="pagina-senha">
        <section class="cartao-senha">
            <span class="marcador-senha" aria-hidden="true">PB</span>
            <p class="sobretitulo-senha">Ponto Batista</p>
            <h1>Crie sua senha</h1>
            <p class="instrucao-senha">Antes de continuar, escolha uma senha pessoal para sua conta.</p>

            {% if mensagem_erro %}
                <p class="erro-senha" role="alert">{{ mensagem_erro }}</p>
            {% endif %}

            <form method="post" class="formulario-senha">
                <label for="senha-nova">Nova senha</label>
                <input id="senha-nova" name="senha_nova" type="password" minlength="6"
                       autocomplete="new-password" required autofocus>

                <p id="aviso-senha" class="aviso-senha" hidden>
                    Guarde essa senha pois é com ela que você acessará o ponto.
                </p>

                <label for="confirmacao-senha">Confirme a nova senha</label>
                <input id="confirmacao-senha" name="confirmacao_senha" type="password"
                       minlength="6" autocomplete="new-password" required>

                <button type="submit">Salvar nova senha</button>
            </form>

            <form method="post" action="{{ url_for('login.sair') }}" class="formulario-sair">
                <button type="submit">Sair da conta</button>
            </form>
        </section>
    </main>
</body>
</html>
