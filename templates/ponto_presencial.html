<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#31425e">
    <title>Registrar ponto | Ponto Batista</title>
    <link rel="stylesheet" href="/static/css/ponto_presencial.css">
    <script src="/static/js/ponto_presencial.js" defer></script>
</head>
<body>
    <main
        class="pagina-ponto-presencial"
        data-registro-url="{{ url_for('inicio.registrar_ponto') }}"
    >
        <section class="cartao-ponto-presencial" aria-labelledby="titulo-ponto-presencial">
            <span class="marca-ponto-presencial" aria-hidden="true">PB</span>
            <p class="sobrelinha-ponto-presencial">Ponto Batista</p>
            <h1 id="titulo-ponto-presencial">Olá, {{ nome_usuario.split()[0] }}</h1>
            <p class="relogio-presencial" data-relogio>--:--:--</p>
            <p class="estado-ponto-presencial" data-mensagem role="status" aria-live="polite">
                Preparando o registro do seu ponto…
            </p>
            <button type="button" class="botao-tentar-novamente" data-tentar hidden>Tentar novamente</button>
            <p class="nota-ponto-presencial">Mantenha a localização do celular ativada e esteja dentro da escola.</p>
        </section>
    </main>
</body>
</html>
