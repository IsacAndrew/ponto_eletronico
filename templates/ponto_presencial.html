<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#31425e">
    <title>Registrar ponto | Ponto Batista</title>
    <link rel="stylesheet" href="/static/css/ponto_presencial.css">
    <link rel="stylesheet" href="/static/css/ajuste_batidas.css">
    <script src="/static/js/ajuste_batidas.js" defer></script>
    <script src="/static/js/ponto_presencial.js" defer></script>
</head>
<body>
    <main
        class="pagina-ponto-presencial"
        data-registro-url="{{ url_for('inicio.registrar_ponto_qr', token=token) }}"
    >
        <section class="cartao-ponto-presencial" aria-labelledby="titulo-ponto-presencial">
            <h1 id="titulo-ponto-presencial">Olá, {{ nome_usuario.split()[0] }}</h1>
            <p class="relogio-presencial" data-relogio>--:--:--</p>
            <p class="estado-ponto-presencial" data-mensagem role="status" aria-live="polite">Preparando o registro do seu ponto…</p>
            <button type="button" class="botao-tentar-novamente" data-tentar hidden>Tentar novamente</button>
            <p class="nota-ponto-presencial">Registro presencial autorizado pelo QR-Code da escola.</p>
        </section>
    </main>
    {% include "ajuste_batidas.html" %}
</body>
</html>
